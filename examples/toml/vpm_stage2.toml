# VPM stage 2: multi-view 3D point-track head on the frozen stage-1 backbone. Launch with training/train_stage2.sh.

[job]
task         = "vfm"
experiment   = "vpm_stage2"
project      = "cosmos3"
group        = "sft"
name         = "vpm_stage2"
wandb_mode   = "disabled"

[model]
max_num_tokens_after_packing = 55000
joint_attn_implementation    = "two_way"
precision                    = "bfloat16"

[model.ema]
enabled         = true
rate            = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree      = -1
data_parallel_replicate_degree  = 1

[model.compile]
enabled                         = false
compile_dynamic                 = true

[model.activation_checkpointing]
mode                = "full"
save_ops_regex      = ["fmha"]
preserve_rng_state  = true
determinism_check   = "default"

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
betas         = [0.9, 0.95]
eps           = 1.0e-6
fused         = true
keys_to_select = [
    "tracking_head",
]
lr            = 2.0e-5
weight_decay  = 0

[scheduler]
cycle_lengths      = [2000]
f_max              = [1.0]
f_min              = [0.0]
f_start            = [0.0]
verbosity_interval = 0
warm_up_steps      = [50]

[trainer]
distributed_parallelism = "fsdp"
grad_accum_iter         = 2
logging_iter            = 1
max_iter                = 2000

[trainer.callbacks.compile_tokenizer]
compile_after_iterations = 3
enabled                  = false

[trainer.callbacks.grad_clip]
clip_norm    = 0.1
force_finite = true

[checkpoint]
keys_to_skip_loading = ["net_ema."]
load_path            = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter            = 250

[dataloader_train]
max_sequence_length = 55000
