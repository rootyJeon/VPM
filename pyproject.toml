[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vpm"
version = "0.1.0"
authors = [
  {name = "VPM authors"},
]
description = "VPM: multi-view video world model with 3D point tracking and robot actions, built on NVIDIA Cosmos3-Nano"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "CC-BY-NC-4.0"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# torch / torchvision / natten / transformer-engine / triton come from one of the
# cu130[-train] or cu128[-train] dependency groups below.
dependencies = [
  "attrs",
  "av",
  "boto3",
  "diffusers",
  "einops",
  "filelock",
  "huggingface-hub",
  "hydra-core",
  "imageio",
  "imageio-ffmpeg",
  "iopath>=0.1.10",
  "loguru",
  "matplotlib",
  "multi-storage-client==0.44.0",
  "numpy",
  "nvidia-cudnn-frontend",
  "nvidia-ml-py",
  "omegaconf",
  "opencv-python-headless",
  "packaging",
  "pandas",
  "pillow>=12.2.0",
  "psutil",
  "pydantic",
  "pytz",
  "pyyaml",
  "qwen-vl-utils",
  "regex",
  "requests",
  "safetensors",
  "scipy",
  "termcolor",
  "tqdm",
  "transformers>=4.57.1,<5.0.0",
  "trimesh",
  "typing-extensions",
  "wandb",
  "webdataset",
]

[project.optional-dependencies]
train = [
  "cloudpickle",
  "tzlocal",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-xdist",
  "ruff==0.12.7",
]
cu128 = [
  "flash-attn-3-nv==1.0.3+cu128.torch210; platform_machine == 'x86_64'",
  "flash-attn==2.7.4.post1+cu128.torch210; platform_machine == 'x86_64'",
  "natten==0.21.6.dev6+cu128.torch210; platform_machine == 'x86_64'",
  "torch==2.10.0+cu128",
  "torchvision==0.25.0+cu128",
  # Pinned CUDA 12.8 runtime wheels matching torch 2.10.0+cu128 (https://github.com/astral-sh/uv/issues/14237).
  "nvidia-cublas-cu12==12.8.4.1",
  "nvidia-cuda-cupti-cu12==12.8.90",
  "nvidia-cuda-nvrtc-cu12==12.8.93",
  "nvidia-cuda-runtime-cu12==12.8.90",
  "nvidia-cudnn-cu12==9.10.2.21",
  "nvidia-cufft-cu12==11.3.3.83",
  "nvidia-cufile-cu12==1.13.1.3",
  "nvidia-curand-cu12==10.3.9.90",
  "nvidia-cusolver-cu12==11.7.3.90",
  "nvidia-cusparse-cu12==12.5.8.93",
  "nvidia-cusparselt-cu12==0.7.1",
  "nvidia-nccl-cu12==2.27.5",
  "nvidia-npp-cu12==12.4.1.87",
  "nvidia-nvjitlink-cu12==12.8.93",
  "nvidia-nvshmem-cu12==3.4.5",
  "nvidia-nvtx-cu12==12.8.90",
]
cu128-train = [
  {include-group = "cu128"},
  "torchao==0.16.0+cu128; platform_machine == 'x86_64'",
  "transformer-engine==2.12.0+cu128.torch210",
  "triton==3.6.0",
]
cu130 = [
  "flash-attn-3-nv==1.0.3+cu130.torch210; platform_machine == 'x86_64'",
  "flash-attn==2.7.4.post1+cu130.torch210; platform_machine == 'x86_64'",
  "natten==0.21.6.dev6+cu130.torch210",
  "torch==2.10.0+cu130",
  "torchvision==0.25.0+cu130",
  # Pinned CUDA 13.0 runtime wheels matching torch 2.10.0+cu130 (https://github.com/astral-sh/uv/issues/14237).
  "nvidia-cublas==13.1.0.3",
  "nvidia-cuda-cupti==13.0.85",
  "nvidia-cuda-nvrtc==13.0.88",
  "nvidia-cuda-runtime==13.0.96",
  "nvidia-cudnn-cu13==9.15.1.9",
  "nvidia-cufft==12.0.0.61",
  "nvidia-cufile==1.15.1.6",
  "nvidia-curand==10.4.0.35",
  "nvidia-cusolver==12.0.4.66",
  "nvidia-cusparse==12.6.3.3",
  "nvidia-cusparselt-cu13==0.8.0",
  "nvidia-nccl-cu13==2.28.9",
  "nvidia-npp==13.0.0.50",
  "nvidia-nvjitlink==13.0.88",
  "nvidia-nvshmem-cu13==3.4.5",
  "nvidia-nvtx==13.0.85",
]
cu130-train = [
  {include-group = "cu130"},
  "torchao==0.16.0+cu130; platform_machine == 'x86_64'",
  "transformer-engine==2.12.0+cu130.torch210",
  "triton==3.6.0",
]

[tool.uv]
required-version = ">=0.11.3"
conflicts = [
  [
    {group = "cu128"},
    {group = "cu128-train"},
    {group = "cu130"},
    {group = "cu130-train"},
  ],
]
override-dependencies = [
  # Same numpy range as the tested training environment.
  "numpy>=2.0.0,<2.3",
  "lightning; sys_platform == 'never'",
  "pynvml; sys_platform == 'never'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
flash-attn = { index = "cosmos" }
flash-attn-3-nv = { index = "cosmos" }
natten = { index = "cosmos" }
torch = { index = "pytorch" }
torchao = { index = "pytorch" }
torchvision = { index = "pytorch" }
transformer-engine = { index = "cosmos" }
triton = { index = "pytorch" }

[[tool.uv.index]]
name = "cosmos"
url = "https://nvidia-cosmos.github.io/cosmos-dependencies/v1.5.0"
explicit = true

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl"
explicit = true

[tool.hatch.build.targets.sdist]
packages = [
  "cosmos_framework",
]

[tool.hatch.build.targets.wheel]
packages = [
  "cosmos_framework",
]
exclude = [
  "*_test.py",
]
